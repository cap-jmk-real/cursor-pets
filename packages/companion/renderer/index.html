<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursor Pets</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
        -webkit-user-select: none;
        overflow: hidden;
      }
      .shell {
        min-height: 100%;
        padding: 10px 12px 12px;
        -webkit-app-region: drag;
      }
      .toolbar,
      .chip,
      button {
        -webkit-app-region: no-drag;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .tb-btn {
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(40, 40, 46, 0.95);
        color: rgba(255, 255, 255, 0.92);
        font-size: 13px;
        font-weight: 600;
      }
      .tb-btn:hover {
        background: rgba(55, 55, 62, 0.98);
      }
      .tb-hint {
        font-size: 11px;
        opacity: 0.6;
        color: rgba(255, 255, 255, 0.85);
      }
      .chip {
        display: inline-block;
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(22, 22, 28, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
        max-width: 100%;
      }
      .viewport {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 72px;
      }
      #spriteCanvas {
        display: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #spriteCanvas.pixel {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .pet {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 22px;
        line-height: 1.3;
        white-space: pre-wrap;
        word-break: break-word;
        color: rgba(245, 245, 250, 0.98);
      }
      .sub {
        margin-top: 8px;
        font-size: 12px;
        opacity: 0.78;
        color: rgba(200, 200, 210, 0.95);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="toolbar">
        <button type="button" class="tb-btn" id="btnMenu">☰</button>
        <span class="tb-hint">Drag · Right-click menu · Resize edges</span>
      </div>
      <div class="chip" id="chip">
        <div class="viewport">
          <canvas id="spriteCanvas" width="128" height="128"></canvas>
          <div class="pet" id="petAscii">(loading)</div>
        </div>
        <div class="sub" id="sub">…</div>
      </div>
    </div>
    <script>
      const petAscii = document.getElementById("petAscii");
      const spriteCanvas = document.getElementById("spriteCanvas");
      const sub = document.getElementById("sub");
      const btnMenu = document.getElementById("btnMenu");

      let asciiTimer = null;
      let spriteTimer = null;
      let spriteFrame = 0;

      function stopTimers() {
        if (asciiTimer) clearInterval(asciiTimer);
        if (spriteTimer) clearInterval(spriteTimer);
        asciiTimer = null;
        spriteTimer = null;
      }

      function applyAscii(snap) {
        spriteCanvas.style.display = "none";
        petAscii.style.display = "block";
        let frames = snap.frames || ["(no frames)"];
        let frameMs = snap.frameMs || 250;
        let i = 0;
        function tick() {
          petAscii.textContent = frames[i % frames.length] ?? frames[0] ?? "(no frame)";
          i = (i + 1) % 1000000;
        }
        tick();
        asciiTimer = setInterval(tick, frameMs);
      }

      function applySprite(snap) {
        petAscii.style.display = "none";
        spriteCanvas.style.display = "block";
        const img = new Image();
        img.onload = () => {
          const ctx = spriteCanvas.getContext("2d");
          const cw = snap.atlas.cellWidth;
          const ch = snap.atlas.cellHeight;
          const maxCss = 192;
          const scale = Math.max(1, Math.min(4, Math.floor(maxCss / Math.max(cw, ch))));
          const dispW = cw * scale;
          const dispH = ch * scale;
          const dpr = window.devicePixelRatio || 1;
          spriteCanvas.width = Math.floor(dispW * dpr);
          spriteCanvas.height = Math.floor(dispH * dpr);
          spriteCanvas.style.width = dispW + "px";
          spriteCanvas.style.height = dispH + "px";
          if (snap.pixelated) {
            spriteCanvas.classList.add("pixel");
            ctx.imageSmoothingEnabled = false;
          } else {
            spriteCanvas.classList.remove("pixel");
            ctx.imageSmoothingEnabled = true;
          }
          spriteFrame = 0;
          const row = snap.row;
          const frameCount = snap.frameCount;
          const frameMs = snap.frameMs || 200;

          function draw() {
            const sx = (spriteFrame % frameCount) * cw;
            const sy = row * ch;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, dispW, dispH);
            ctx.drawImage(img, sx, sy, cw, ch, 0, 0, dispW, dispH);
            spriteFrame = (spriteFrame + 1) % frameCount;
          }
          draw();
          spriteTimer = setInterval(draw, frameMs);
        };
        img.onerror = () => {
          petAscii.style.display = "block";
          spriteCanvas.style.display = "none";
          petAscii.textContent = "(sprite load failed)";
        };
        img.src = snap.imageDataUrl;
      }

      function applySnapshot(snap) {
        stopTimers();
        sub.textContent = snap.subtitle || "";
        if (snap.mode === "sprite") applySprite(snap);
        else applyAscii(snap);
      }

      window.cursorPets.getSnapshot().then(applySnapshot);
      window.cursorPets.onSnapshot(applySnapshot);

      function openMenuAt(x, y) {
        window.cursorPets.showNativeMenu(x, y);
      }

      document.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        openMenuAt(e.clientX, e.clientY);
      });

      btnMenu.addEventListener("click", (e) => {
        e.stopPropagation();
        const r = btnMenu.getBoundingClientRect();
        openMenuAt(r.left, r.bottom + 4);
      });
    </script>
  </body>
</html>
