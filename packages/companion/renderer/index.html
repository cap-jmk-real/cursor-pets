<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursor Pets</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        background: transparent;
        color: rgba(255,255,255,0.92);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .wrap {
        margin: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(20,20,24,0.72);
        border: 1px solid rgba(255,255,255,0.14);
        backdrop-filter: blur(10px);
      }
      .pet { font-size: 18px; white-space: pre; }
      .sub { margin-top: 6px; font-size: 11px; opacity: 0.75; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="pet" id="pet">(loading)</div>
      <div class="sub" id="sub">…</div>
    </div>
    <script>
      const pet = document.getElementById("pet");
      const sub = document.getElementById("sub");
      let frames = ["(loading)"];
      let frameMs = 250;
      let i = 0;
      let timer = null;

      function renderOnce() {
        pet.textContent = frames[i % frames.length] ?? frames[0] ?? "(no frame)";
        i = (i + 1) % 1000000;
      }

      function restart() {
        if (timer) clearInterval(timer);
        i = 0;
        renderOnce();
        timer = setInterval(renderOnce, frameMs);
      }

      async function applySnapshot(snap) {
        frames = snap.frames || ["(no frames)"];
        frameMs = snap.frameMs || 250;
        sub.textContent = snap.subtitle || "";
        restart();
      }

      window.cursorPets.getSnapshot().then(applySnapshot);
      window.cursorPets.onSnapshot(applySnapshot);
    </script>
  </body>
</html>
